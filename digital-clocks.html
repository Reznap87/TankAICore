<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Digitale Uhren — Mehrere Zeitzonen (accessible, search, export/import, shortcuts, theme)</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --muted:#9aa4b2; --accent:#4fd1c5; --glass:rgba(255,255,255,0.03);
      --text:#e6eef6;
    }
    [data-theme="light"]{
      --bg:#f6fbff; --card:#ffffff; --muted:#64748b; --accent:#0ea5a4; --glass:rgba(2,6,23,0.03);
      --text:#0b1220;
    }
    html,body{height:100%;margin:0}
    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg, #071127 0%, #0b1b2b 100%);
      color:var(--text);
      padding:2rem;
      min-height:100vh;
      box-sizing:border-box;
    }
    header h1{margin:0 0 1rem;font-weight:600}
    .controls{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
    select,input,button{font-size:1rem;padding:.45rem .6rem;border-radius:.5rem;border:1px solid rgba(255,255,255,0.06);background:var(--card);color:inherit}
    input[type="text"]{min-width:220px}
    button{cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
    .card{
      background:var(--glass); padding:1rem; border-radius:.75rem;
      border:1px solid rgba(255,255,255,0.03); box-shadow:0 6px 18px rgba(2,6,23,0.6);
      display:flex; flex-direction:column; gap:.5rem;
    }
    .card.drag-over{outline:2px dashed var(--accent)}
    .tz-name{font-weight:700;font-size:0.95rem;margin-bottom:.25rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
    .tz-label{font-weight:700}
    .time{font-size:1.6rem;font-variant-numeric:tabular-nums;margin-bottom:.25rem;display:flex;gap:.5rem;align-items:center}
    .sec-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0.3;transition:opacity .12s linear}
    .sec-dot.tick{opacity:1}
    .meta{color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
    .small-btn{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:.25rem .4rem;border-radius:.45rem;color:var(--muted);cursor:pointer}
    .handle{cursor:grab;padding:.15rem .4rem;border-radius:.35rem;border:1px solid rgba(255,255,255,0.03);background:rgba(255,255,255,0.02)}
    footer{margin-top:1.5rem;color:var(--muted);font-size:.85rem}
    .note{color:var(--muted);font-size:.9rem}
    .top-actions{display:flex;gap:.5rem;align-items:center}
    input[type="file"]{display:none}
    .search-box{min-width:220px;padding:.35rem .5rem;border-radius:.4rem;border:1px solid rgba(255,255,255,0.06);background:var(--card);color:inherit}
    /* focus styles */
    .card:focus-within{box-shadow:0 0 0 3px rgba(79,209,197,0.08);outline:none}
    /* responsive small tweaks */
    @media (max-width:520px){
      .controls{flex-direction:column;align-items:stretch}
      .top-actions{flex-wrap:wrap}
    }
  </style>
</head>
<body data-theme="dark">
  <header>
    <h1>Digitale Uhren — Mehrere Zeitzonen</h1>

    <div class="controls" aria-label="Zeitzonen Steuerung">
      <input id="tz-search" class="search-box" type="text" placeholder="Zeitzone suchen (z. B. Berlin)" aria-label="Zeitzone suchen" />
      <select id="tz-select" aria-label="Zeitzone Auswahl"></select>
      <button id="add-btn">Zeitzone hinzufügen</button>
      <input id="custom-tz" type="text" placeholder="Eigene IANA‑Zeitzone (z. B. Europe/Berlin)" aria-label="Eigene Zeitzone" />
      <button id="add-custom">Hinzufügen</button>
      <button id="add-local">Meine Zeitzone</button>
      <button id="clear-btn">Alle löschen</button>
      <label style="margin-left:auto" class="note">
        <input type="checkbox" id="hour12" /> 12‑Stunden
      </label>
      <button id="theme-toggle" title="Theme umschalten" aria-label="Theme umschalten" style="margin-left:.5rem">🌗</button>
    </div>

    <div class="controls top-actions" style="margin-top:.5rem">
      <button id="export-btn">Export (JSON)</button>
      <button id="import-btn">Import (JSON)</button>
      <input id="file-input" type="file" accept="application/json" />
      <button id="copy-btn">Konfig. kopieren</button>
      <button id="paste-btn">Konfig. einfügen</button>
      <div style="margin-left:auto" class="note">Tasten: Wähle Karte → J/K oder Pfeil ↑/↓ zum Verschieben</div>
    </div>
  </header>

  <main>
    <section class="grid" id="clocks" aria-live="polite"></section>
  </main>

  <footer>
    <div class="note">Tipp: Verwende IANA‑Zeitzonen (z. B. "America/New_York"). Auswahl und Reihenfolge werden im Browser gespeichert.</div>
    <div style="margin-top:.5rem" class="note">LocalStorage keys: <code>digital-clocks.zones</code>, <code>digital-clocks.hour12</code>, <code>digital-clocks.theme</code>.</div>
  </footer>

  <script>
    // Keys & initial lists
    const STORAGE_KEY = 'digital-clocks.zones';
    const STORAGE_HOUR12 = 'digital-clocks.hour12';
    const STORAGE_THEME = 'digital-clocks.theme';

    const DEFAULT_ZONES = ['UTC','Europe/London','Europe/Berlin','America/New_York','America/Los_Angeles','Asia/Tokyo','Asia/Shanghai','Australia/Sydney'];
    const ALL_ZONES = ['UTC','Etc/GMT','Europe/London','Europe/Dublin','Europe/Berlin','Europe/Paris','Europe/Madrid','Europe/Rome','Europe/Zurich','Europe/Amsterdam','Europe/Moscow','Europe/Istanbul','Africa/Cairo','Africa/Johannesburg','Asia/Dubai','Asia/Karachi','Asia/Kolkata','Asia/Jakarta','Asia/Bangkok','Asia/Shanghai','Asia/Hong_Kong','Asia/Tokyo','Asia/Seoul','Asia/Singapore','Australia/Perth','Australia/Sydney','Pacific/Auckland','America/St_Johns','America/Sao_Paulo','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Anchorage','Pacific/Honolulu','America/Mexico_City','America/Bogota','America/Lima'];

    // DOM
    const tzSearch = document.getElementById('tz-search');
    const tzSelect = document.getElementById('tz-select');
    const clocksEl = document.getElementById('clocks');
    const addBtn = document.getElementById('add-btn');
    const addCustomBtn = document.getElementById('add-custom');
    const customInput = document.getElementById('custom-tz');
    const addLocalBtn = document.getElementById('add-local');
    const clearBtn = document.getElementById('clear-btn');
    const hour12Checkbox = document.getElementById('hour12');

    const exportBtn = document.getElementById('export-btn');
    const importBtn = document.getElementById('import-btn');
    const fileInput = document.getElementById('file-input');
    const copyBtn = document.getElementById('copy-btn');
    const pasteBtn = document.getElementById('paste-btn');
    const themeToggle = document.getElementById('theme-toggle');

    function fuzzyMatches(query, text) {
      query = query.trim().toLowerCase();
      if (!query) return true;
      text = text.toLowerCase();
      let qi = 0;
      for (let i = 0; i < text.length && qi < query.length; i++) {
        if (text[i] === query[qi]) qi++;
      }
      return qi === query.length;
    }

    function populateSelect(filter = '') {
      tzSelect.innerHTML = '';
      ALL_ZONES.forEach(z => {
        if (!filter || fuzzyMatches(filter, z)) {
          const opt = document.createElement('option');
          opt.value = z;
          opt.textContent = z;
          tzSelect.appendChild(opt);
        }
      });
    }
    tzSearch.addEventListener('input', (e) => populateSelect(e.target.value));

    const active = new Map(); // tz -> {id, el, timeEl, dateEl, tzShortEl}

    function loadState() {
      try {
        const serialized = localStorage.getItem(STORAGE_KEY);
        const hour12 = localStorage.getItem(STORAGE_HOUR12);
        const theme = localStorage.getItem(STORAGE_THEME);
        if (hour12 !== null) hour12Checkbox.checked = hour12 === '1';
        if (theme) document.body.setAttribute('data-theme', theme);
        if (serialized) {
          const arr = JSON.parse(serialized);
          if (Array.isArray(arr) && arr.length) return arr;
        }
      } catch (e) { console.warn('Fehler beim Lesen des lokalen Speichers', e); }
      return DEFAULT_ZONES.slice();
    }

    function saveState() {
      try {
        const arr = Array.from(active.keys());
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        localStorage.setItem(STORAGE_HOUR12, hour12Checkbox.checked ? '1' : '0');
        localStorage.setItem(STORAGE_THEME, document.body.getAttribute('data-theme') || 'dark');
      } catch (e) { console.warn('Fehler beim Speichern in localStorage', e); }
    }

    // keyboard shortcuts: when a card or its child is focused
    document.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (!activeEl) return;
      const card = activeEl.closest && activeEl.closest('.card');
      if (!card) return;
      // J / ArrowDown -> move down; K / ArrowUp -> move up
      if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveDown(card); }
      if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveUp(card); }
    });

    function createClockCard(tz, skipSave = false) {
      if (active.has(tz)) return;
      const id = 'clk-' + Math.random().toString(36).slice(2,9);
      const card = document.createElement('article');
      card.className = 'card';
      card.id = id;
      card.setAttribute('role','group');
      card.setAttribute('aria-label', 'Uhr für ' + tz);
      card.setAttribute('tabindex','0'); // focusable
      card.setAttribute('draggable','true');
      card.dataset.tz = tz;

      // Header: handle + label + short tz
      const name = document.createElement('div'); name.className = 'tz-name';
      const left = document.createElement('div'); left.style.display='flex'; left.style.alignItems='center'; left.style.gap='.5rem';
      const handle = document.createElement('button'); // use button for accessibility
      handle.className = 'handle';
      handle.setAttribute('aria-label','Reihenfolge per Drag verschieben');
      handle.setAttribute('title','Ziehe zum Verschieben (oder nutze J/K)');
      handle.textContent = '⇅';
      handle.style.border='none'; handle.style.background='transparent'; handle.style.color='inherit';
      // Allow keyboard activation: when handle focused, pressing space or enter starts drag simulation? Keep it as a focusable hint.
      left.appendChild(handle);
      const label = document.createElement('span'); label.className='tz-label'; label.textContent = tz;
      left.appendChild(label);
      name.appendChild(left);

      const tzShort = document.createElement('span'); tzShort.className='tz-short note'; tzShort.style.fontWeight=400; tzShort.style.fontSize='0.9rem';
      name.appendChild(tzShort);
      card.appendChild(name);

      // time + animated second dot
      const time = document.createElement('div'); time.className='time';
      const timeText = document.createElement('span'); timeText.className='time-text'; timeText.textContent='–';
      const secDot = document.createElement('span'); secDot.className='sec-dot'; secDot.setAttribute('aria-hidden','true');
      time.appendChild(timeText); time.appendChild(secDot);
      card.appendChild(time);

      // date / actions
      const meta = document.createElement('div'); meta.className='meta';
      const date = document.createElement('div'); date.textContent='';
      meta.appendChild(date);

      const actions = document.createElement('div'); actions.style.display='flex'; actions.style.gap='.4rem'; actions.style.alignItems='center';
      const up = document.createElement('button'); up.className='small-btn'; up.title='Eine Position nach oben'; up.textContent='▲'; up.addEventListener('click', ()=>moveUp(card));
      const down = document.createElement('button'); down.className='small-btn'; down.title='Eine Position nach unten'; down.textContent='▼'; down.addEventListener('click', ()=>moveDown(card));
      const rem = document.createElement('button'); rem.className='small-btn'; rem.title='Zeitzone entfernen'; rem.textContent='Entfernen'; rem.addEventListener('click', ()=>{ active.delete(tz); card.remove(); saveState(); });
      actions.appendChild(up); actions.appendChild(down); actions.appendChild(rem);
      meta.appendChild(actions);

      card.appendChild(meta);
      clocksEl.appendChild(card);
      active.set(tz, { id, el: card, timeEl: timeText, dateEl: date, tz, tzShortEl: tzShort, secDot });

      attachDragHandlers(card);
      updateClockFor(tz);
      if (!skipSave) saveState();
    }

    function updateClockFor(tz) {
      const entry = active.get(tz); if (!entry) return;
      const now = new Date();
      const opts = { hour:'numeric', minute:'2-digit', second:'2-digit', hour12:hour12Checkbox.checked, timeZone:tz, timeZoneName:'short' };
      try {
        const fmt = new Intl.DateTimeFormat(undefined, opts);
        entry.timeEl.textContent = fmt.format(now);
        const dateFmt = new Intl.DateTimeFormat(undefined, { year:'numeric', month:'short', day:'numeric', timeZone: tz });
        entry.dateEl.textContent = dateFmt.format(now);
        const parts = fmt.formatToParts(now);
        const tzNamePart = parts.find(p => p.type === 'timeZoneName');
        entry.tzShortEl.textContent = tzNamePart ? tzNamePart.value : '';
      } catch (err) {
        entry.timeEl.textContent = 'Nicht unterstützte Zeitzone';
        entry.dateEl.textContent = '';
        entry.tzShortEl.textContent = '';
      }
    }

    let lastSec = null;
    function tickSecondsDot() {
      const now = new Date();
      const s = now.getSeconds();
      for (const v of active.values()) {
        if (!v.secDot) continue;
        if (s !== lastSec) {
          v.secDot.classList.add('tick');
          setTimeout(()=>v.secDot.classList.remove('tick'), 150);
        }
      }
      lastSec = s;
    }

    function updateAll() { for (const tz of active.keys()) updateClockFor(tz); tickSecondsDot(); }
    setInterval(updateAll, 1000);

    // Drag & Drop (native)
    let dragSrc = null;
    function attachDragHandlers(card) {
      card.addEventListener('dragstart', (e) => {
        dragSrc = card;
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', card.id); } catch {}
        card.style.opacity = '0.6';
      });
      card.addEventListener('dragend', () => {
        dragSrc = null; card.style.opacity = ''; document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
      });
      card.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (card !== dragSrc) card.classList.add('drag-over'); });
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', (e) => {
        e.stopPropagation();
        card.classList.remove('drag-over');
        if (!dragSrc || dragSrc === card) return;
        const rect = card.getBoundingClientRect();
        const isAfter = (e.clientY - rect.top) > rect.height/2;
        if (isAfter) card.after(dragSrc); else card.before(dragSrc);
        reorderFromDOM();
      });
    }

    function reorderFromDOM() {
      const order = Array.from(clocksEl.children).map(ch => ch.dataset.tz).filter(Boolean);
      const newMap = new Map();
      for (const tz of order) if (active.has(tz)) newMap.set(tz, active.get(tz));
      active.clear();
      for (const [k,v] of newMap) active.set(k,v);
      saveState();
    }

    function moveUp(card) {
      const prev = card.previousElementSibling;
      if (prev) { prev.before(card); reorderFromDOM(); card.focus(); }
    }
    function moveDown(card) {
      const next = card.nextElementSibling;
      if (next) { next.after(card); reorderFromDOM(); card.focus(); }
    }

    // UI handlers
    addBtn.addEventListener('click', ()=>{ const tz = tzSelect.value.trim(); if (!tz) return; createClockCard(tz); });
    addCustomBtn.addEventListener('click', ()=>{ const tz = customInput.value.trim(); if (!tz) return; try { new Intl.DateTimeFormat('en-US', { timeZone: tz }).format(); createClockCard(tz); customInput.value=''; } catch (err) { alert('Ungültige IANA‑Zeitzone: ' + tz); } });
    customInput.addEventListener('keyup', (e)=>{ if (e.key==='Enter') addCustomBtn.click(); });
    addLocalBtn.addEventListener('click', ()=> createClockCard(Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local'));
    clearBtn.addEventListener('click', ()=>{ if (confirm('Alle Zeitzonen wirklich entfernen?')) { active.clear(); clocksEl.innerHTML=''; saveState(); }});
    hour12Checkbox.addEventListener('change', ()=>{ saveState(); updateAll(); });

    // Export / Import / Clipboard
    function getStateObject() { return { zones: Array.from(active.keys()), hour12: !!hour12Checkbox.checked, theme: document.body.getAttribute('data-theme') || 'dark', ts: new Date().toISOString() }; }
    exportBtn.addEventListener('click', () => {
      const obj = getStateObject();
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const name = `digital-clocks-config-${new Date().toISOString().slice(0,10)}.json`;
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    importBtn.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', (e)=> {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = ()=> {
        try { const obj = JSON.parse(reader.result); applyImportedState(obj); } catch { alert('Fehler beim Lesen der Datei: ungültiges JSON'); }
      };
      reader.readAsText(f); fileInput.value = '';
    });
    copyBtn.addEventListener('click', async ()=> {
      const obj = getStateObject();
      try { await navigator.clipboard.writeText(JSON.stringify(obj)); alert('Konfiguration in die Zwischenablage kopiert'); }
      catch { prompt('Konfiguration (kopieren):', JSON.stringify(obj, null, 2)); }
    });
    pasteBtn.addEventListener('click', async ()=> {
      try {
        const txt = await navigator.clipboard.readText();
        if (!txt) { alert('Zwischenablage ist leer'); return; }
        const obj = JSON.parse(txt); applyImportedState(obj);
      } catch (err) {
        const txt2 = prompt('Füge JSON‑Konfiguration ein:');
        if (!txt2) return;
        try { const obj = JSON.parse(txt2); applyImportedState(obj); } catch { alert('Ungültiges JSON'); }
      }
    });

    function applyImportedState(obj) {
      if (!obj || !Array.isArray(obj.zones)) { alert('Ungültiges Format: erwartetes Objekt mit "zones" Array'); return; }
      const validZones = [];
      for (const z of obj.zones) {
        if (typeof z !== 'string') continue;
        try { new Intl.DateTimeFormat('en-US', { timeZone: z }).format(); validZones.push(z); } catch { console.warn('Ungültige Zeitzone in Import übersprungen:', z); }
      }
      if (validZones.length === 0) { alert('Keine gültigen Zeitzonen gefunden'); return; }
      active.clear(); clocksEl.innerHTML = '';
      validZones.forEach(z => createClockCard(z, true));
      hour12Checkbox.checked = !!obj.hour12;
      const theme = obj.theme || 'dark'; document.body.setAttribute('data-theme', theme);
      saveState(); updateAll(); alert('Konfiguration importiert ('+validZones.length+' Zonen)');
    }

    // Theme toggle
    themeToggle.addEventListener('click', ()=> {
      const cur = document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = cur === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', next);
      saveState();
    });

    // Init
    populateSelect();
    const zones = loadState();
    zones.forEach(z => createClockCard(z, true));
    saveState();
    updateAll();
  </script>
</body>
</html>
