services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
      - --model-url
      - "${LOCAL_LLM_MODEL_URL:-https://huggingface.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf}"
      - --alias
      - qwen2.5-coder-7b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${LOCAL_LLM_CTX_SIZE:-4096}"
      - --parallel
      - "${LOCAL_LLM_PARALLEL:-1}"
    volumes:
      - qwen25_coder_models:/models
    expose:
      - "8080"
    restart: unless-stopped
    pids_limit: 512

  tankai:
    depends_on:
      llama:
        condition: service_started
    environment:
      TANKAI_LLM: "openai"
      OPENAI_API_KEY: "${LOCAL_LLM_API_KEY:-local-tankai}"
      OPENAI_MODEL: "qwen2.5-coder-7b-instruct"
      OPENAI_BASE_URL: "http://llama:8080/v1"
      TANKAI_LLM_TIMEOUT_SECONDS: "${LOCAL_LLM_TIMEOUT_SECONDS:-120}"

volumes:
  qwen25_coder_models:
