name: One-shot web LLM call budget wiring

on:
  push:
    branches:
      - ops/live-provider-call-budget

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Wire production web run call ceiling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tankai/web/runtime.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''def _env_bool(name: str, default: bool = False) -> bool:\n    return _env(name, "1" if default else "0").lower() in {"1", "true", "yes", "on"}\n\n\nclass WorkspaceHistory:\n''',
              '''def _env_bool(name: str, default: bool = False) -> bool:\n    return _env(name, "1" if default else "0").lower() in {"1", "true", "yes", "on"}\n\n\ndef _env_int(name: str, default: int, *, minimum: int, maximum: int) -> int:\n    raw = _env(name, str(default))\n    try:\n        value = int(raw)\n    except ValueError as exc:\n        raise RuntimeError(f"{name} muss eine ganze Zahl sein") from exc\n    if value < minimum or value > maximum:\n        raise RuntimeError(f"{name} muss zwischen {minimum} und {maximum} liegen")\n    return value\n\n\nclass WorkspaceHistory:\n''',
              "runtime env int helper",
          )
          replace_once(
              '''                require_research_evidence=_env_bool("TANKAI_REQUIRE_RESEARCH_EVIDENCE", True),\n                verbose=False,\n''',
              '''                require_research_evidence=_env_bool("TANKAI_REQUIRE_RESEARCH_EVIDENCE", True),\n                max_llm_calls_per_run=_env_int(\n                    "TANKAI_LLM_MAX_CALLS_PER_RUN", 40, minimum=7, maximum=40\n                ),\n                verbose=False,\n''',
              "runtime TankAI call budget",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit final patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-web-call-budget-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tankai/web/runtime.py .github/workflows/patch-web-call-budget-once.yml
          git commit -m "ops: wire production per-run LLM call ceiling"
          git push origin HEAD:ops/live-provider-call-budget
