name: One-shot masterplan runtime/head clarification

on:
  push:
    branches:
      - docs/masterplan-runtime-head-split

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Clarify runtime basis versus repository head
        run: python .github/scripts/sync_masterplan_head_split_once.py
      - name: Commit final docs-only diff
        shell: bash
        run: |
          rm .github/workflows/sync-masterplan-head-split-once.yml
          rm .github/scripts/sync_masterplan_head_split_once.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TANKAI_MASTERPLAN.md .github/workflows/sync-masterplan-head-split-once.yml .github/scripts/sync_masterplan_head_split_once.py
          git commit -m "docs: distinguish production runtime from docs head"
          git push origin HEAD:docs/masterplan-runtime-head-split
