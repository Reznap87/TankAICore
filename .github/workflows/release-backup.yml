name: TankAI Core Release Backup

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
      drive_folder_id:
        description: Optional Google Drive folder ID for the publication plan
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify source
        run: |
          python -m compileall -q tankai tests
          python -m pytest -q
          python -m tankai --selftest
      - name: Build deterministic backup
        run: |
          mkdir -p "$RUNNER_TEMP/tankai-release"
          python -m tankai.dev_orchestrator.release_cli build \
            --project-root . \
            --output-directory "$RUNNER_TEMP/tankai-release" \
            --version "${{ inputs.version }}" \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"
      - name: Verify backup
        run: |
          ARCHIVE="$(find "$RUNNER_TEMP/tankai-release" -maxdepth 1 -name '*.zip' -print -quit)"
          SUMS="$(find "$RUNNER_TEMP/tankai-release" -maxdepth 1 -name '*.SHA256SUMS' -print -quit)"
          python -m tankai.dev_orchestrator.release_cli verify \
            --archive "$ARCHIVE" \
            --checksums "$SUMS"
      - name: Build publication ledger
        env:
          DRIVE_FOLDER_ID: ${{ inputs.drive_folder_id }}
        run: |
          ARGS=(
            plan
            --release-directory "$RUNNER_TEMP/tankai-release"
            --ledger "$RUNNER_TEMP/tankai-release/publication-ledger.json"
            --version "${{ inputs.version }}"
            --commit "${{ github.sha }}"
            --branch "${{ github.ref_name }}"
            --github-target "github-main=${{ github.repository }}"
          )
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            ARGS+=(--drive-target "drive-main=$DRIVE_FOLDER_ID")
          fi
          python -m tankai.dev_orchestrator.publication_cli "${ARGS[@]}"
          python -m tankai.dev_orchestrator.publication_cli record-source \
            --ledger "$RUNNER_TEMP/tankai-release/publication-ledger.json" \
            --target-id github-main \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --remote-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          python -m tankai.dev_orchestrator.publication_cli status \
            --ledger "$RUNNER_TEMP/tankai-release/publication-ledger.json" \
            --release-directory "$RUNNER_TEMP/tankai-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tankai-core-${{ inputs.version }}
          path: ${{ runner.temp }}/tankai-release/*
          if-no-files-found: error
          retention-days: 90
