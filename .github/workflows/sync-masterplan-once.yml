name: One-shot masterplan production sync

on:
  push:
    branches:
      - docs/masterplan-production-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Replace only current Reality Contract
        run: python .github/scripts/sync_masterplan_once.py
      - name: Commit final docs-only diff
        shell: bash
        run: |
          rm .github/workflows/sync-masterplan-once.yml
          rm .github/scripts/sync_masterplan_once.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TANKAI_MASTERPLAN.md .github/workflows/sync-masterplan-once.yml .github/scripts/sync_masterplan_once.py
          git commit -m "docs: sync masterplan to verified production state"
          git push origin HEAD:docs/masterplan-production-sync
