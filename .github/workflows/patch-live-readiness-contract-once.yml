name: One-shot live-readiness contract patch

on:
  push:
    branches:
      - ops/live-provider-runtime-wiring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Patch readiness detector for opt-in live mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/production_live_provider_readiness.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''def _dynamic_container_value(source: str, name: str) -> bool:\n    markers = (\n        f"{name}: env.",\n        f"{name}: this.env.",\n        f'"{name}": env.',\n        f'"{name}": this.env.',\n    )\n    return any(marker in source for marker in markers)\n''',
              '''def _dynamic_container_value(source: str, name: str) -> bool:\n    return any(\n        marker in source\n        for marker in (f"this.env.{name}", f"env.{name}")\n    )\n\n\ndef _assignment_line_contains(source: str, name: str, *needles: str) -> bool:\n    return any(\n        name in line and all(needle in line for needle in needles)\n        for line in source.splitlines()\n    )\n''',
              "dynamic container detector",
          )

          replace_once(
              '''    container_provider_dynamic = _dynamic_container_value(cloudflare, "TANKAI_LLM")\n    checks.append(\n        Check(\n            "container_provider_selection",\n            "PASS" if container_provider_dynamic else "FAIL",\n            "production container provider is supplied through Worker environment"\n            if container_provider_dynamic\n            else "production container provider is not dynamically supplied; current source remains fail-closed/mock-only",\n        )\n    )\n''',
              '''    container_provider_dynamic = _dynamic_container_value(cloudflare, "TANKAI_LLM")\n    checks.append(\n        Check(\n            "container_provider_selection",\n            "PASS" if container_provider_dynamic else "FAIL",\n            "production container provider is supplied through Worker environment"\n            if container_provider_dynamic\n            else "production container provider is not dynamically supplied; current source remains fail-closed/mock-only",\n        )\n    )\n\n    live_mode_fail_closed = (\n        "TANKAI_LIVE_PROVIDER_ENABLED" in cloudflare\n        and _assignment_line_contains(\n            cloudflare,\n            "TANKAI_LLM",\n            "liveProviderEnabled",\n            '"mock"',\n        )\n    )\n    checks.append(\n        Check(\n            "live_mode_fail_closed",\n            "PASS" if live_mode_fail_closed else "FAIL",\n            "live provider mode is opt-in and otherwise resolves to mock"\n            if live_mode_fail_closed\n            else "live-provider opt-in/mock fallback contract is missing",\n        )\n    )\n''',
              "fail-closed live-mode check",
          )

          old_critic = '''    critic_production_enforced = (\n        "TANKAI_REQUIRE_INDEPENDENT_CRITIC" in cloudflare\n        and any(\n            marker in cloudflare\n            for marker in (\n                'TANKAI_REQUIRE_INDEPENDENT_CRITIC: "1"',\n                'TANKAI_REQUIRE_INDEPENDENT_CRITIC: "true"',\n                '"TANKAI_REQUIRE_INDEPENDENT_CRITIC": "1"',\n                '"TANKAI_REQUIRE_INDEPENDENT_CRITIC": "true"',\n            )\n        )\n    )\n'''
          new_critic = '''    critic_production_enforced = (\n        _dynamic_container_value(cloudflare, "TANKAI_CRITIC_LLM")\n        and _assignment_line_contains(\n            cloudflare,\n            "TANKAI_REQUIRE_INDEPENDENT_CRITIC",\n            "liveProviderEnabled",\n            '"1"',\n            '"0"',\n        )\n    )\n'''
          replace_once(old_critic, new_critic, "critic production enforcement")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit final patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-live-readiness-contract-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/production_live_provider_readiness.py .github/workflows/patch-live-readiness-contract-once.yml
          git commit -m "ops: verify fail-closed live-provider wiring"
          git push origin HEAD:ops/live-provider-runtime-wiring
