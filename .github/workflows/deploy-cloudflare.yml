name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Select DEPLOY to publish main to production"
        required: true
        type: choice
        options:
          - CANCEL
          - DEPLOY
      expected_sha:
        description: "Paste the exact current main commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker and container
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY' && github.sha == inputs.expected_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify protected main and exact-SHA CI
        run: >-
          python .github/scripts/production_deploy_gate.py
          --repository "${GITHUB_REPOSITORY}"
          --expected-sha "${GITHUB_SHA}"
      - name: Verify production secret presence
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Cloudflare dependencies
        run: npm ci --ignore-scripts
      - name: Verify Cloudflare Containers access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler containers list >/dev/null
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          command: deploy
