name: TankAI Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q tankai tests
      - name: Test
        run: python -m pytest -q
      - name: Self-test
        run: python -m tankai --selftest

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Cloudflare dependencies
        run: npm ci --ignore-scripts
      - name: Generate bindings, typecheck and build dry-run
        run: npm run cf:check
      - name: Verify Worker artifact
        run: test -s dist/cloudflare.js
      - name: Build production container
        run: docker build --tag "tankai-core-ci:${GITHUB_SHA}" .
